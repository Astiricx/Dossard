<!doctype html>
<html lang="fr" data-theme="sombre">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dossard</title>
  <meta name="description" content="Préparation et suivi d'entraînement, course à pied et triathlon.">
  <meta name="theme-color" content="#0E1621">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icone-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dossard">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- En-tête : préparation suivie (touche pour en changer) + réglages -->
  <header id="entete">
    <button id="prep-active" data-a="choisir-prep" aria-label="Changer de préparation"></button>
    <a href="#reglages" class="icone" aria-label="Réglages et données">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </a>
  </header>

  <!-- Zone où chaque vue (js/vues/*.js) écrit son contenu -->
  <main id="vue"><p class="chargement">Chargement…</p></main>

  <!-- Barre d'onglets -->
  <nav id="onglets" aria-label="Navigation">
    <a href="#accueil" data-onglet="accueil"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Accueil</a>
    <a href="#plan" data-onglet="plan"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Plan</a>
    <a href="#calendrier" data-onglet="calendrier"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendrier</a>
    <a href="#suivi" data-onglet="suivi"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>Suivi</a>
    <a href="#prepas" data-onglet="prepas"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>Prépas</a>
  </nav>

  <!-- Feuille (formulaires) et message bref -->
  <div id="feuille" hidden></div>
  <div id="toast" role="status" hidden></div>
  <input type="file" id="fichier-import" accept=".json,application/json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
